name: livesync-commonlib-integration

services:
  couchdb:
    image: couchdb:3.5.0
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: testpassword
    ports:
      - "5989:5984"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set integration http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing integration/livesync-test-bucket

  webdav:
    image: httpd:2.4.68
    ports:
      - "8088:80"
    tmpfs:
      - /usr/local/apache2/htdocs/dav:mode=0777
      - /usr/local/apache2/var:mode=0777
    volumes:
      - ./webdav/httpd.conf:/usr/local/apache2/conf/httpd.conf:ro

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_PASSWORD: integration-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "5442:5432"
    volumes:
      - ./postgrest/00_roles.sql:/docker-entrypoint-initdb.d/00_roles.sql:ro
      - ../../sql/postgrest/adaptive_journal_v1.sql:/docker-entrypoint-initdb.d/01_adaptive_journal_v1.sql:ro
      - ./postgrest/02_fixture.sql:/docker-entrypoint-initdb.d/02_fixture.sql:ro

  postgrest:
    image: postgrest/postgrest:v14.16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_ANON_ROLE: livesync_postgrest_anon
      PGRST_DB_SCHEMAS: livesync_api
      PGRST_DB_URI: postgres://livesync_postgrest_authenticator:integration-password@postgres:5432/postgres
      PGRST_SERVER_PORT: 3000
    ports:
      - "3001:3000"
