name: Downstream CI

on:
  workflow_dispatch:
    inputs:
      consumer_sha:
        description: Full Self-hosted LiveSync commit SHA to validate
        required: true
        type: string
      kit_sha:
        description: Full Fancy Kit commit SHA to preview, or blank for the locked packages
        required: false
        type: string
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  self-hosted-livesync:
    name: Self-hosted LiveSync package consumer
    uses: vrtmrz/obsidian-livesync/.github/workflows/library-preview.yml@f475ea1c6343b690214e0946bbf121518235ae96
    with:
      commonlib_sha: ${{ github.sha }}
      kit_sha: ${{ inputs.kit_sha }}
      consumer_sha: ${{ inputs.consumer_sha }}
